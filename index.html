<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정현 포트폴리오</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">정현</div>
      <ul class="nav-menu">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="hamburger">☰</button>
      <button id="theme-toggle" aria-label="다크 모드 전환">🌙</button>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h1>안녕하세요, 김정현입니다.</h1>
      <p>b1-1 과제 웹사이트입니다.</p>
      <a href="#projects" class="cta-btn">프로젝트 보기</a>
    </section>

    <section id="about" class="fade-in">
  <h2>About</h2>
  <div class="about-content">
    <img src="images/profile.jpg" alt="정현 프로필 사진">
    <p>대학교 재학중인 남학생입니다.</p>
  </div>
</section>

    <section id="skills" class="fade-in">
      <h2>Skills</h2>
      <ul class="skill-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>C++</li>
        <li>C</li>
        <li>Python</li>
      </ul>
    </section>

    <<section id="projects" class="fade-in">>
      <h2>Projects</h2>
      <div class="project-grid">
        <!-- GitHub API로 나중에 채워질 자리 -->
      </div>
    </section>

    <<section id="contact" class="fade-in">>
      <h2>Contact</h2>
      <form id="contact-form" novalidate>
  <div class="form-group">
    <label for="name">이름</label>
    <input type="text" id="name" name="name">
    <p class="error-message" id="name-error"></p>
  </div>

  <div class="form-group">
    <label for="email">이메일</label>
    <input type="email" id="email" name="email">
    <p class="error-message" id="email-error"></p>
  </div>

  <div class="form-group">
    <label for="message">메시지</label>
    <textarea id="message" name="message"></textarea>
    <p class="error-message" id="message-error"></p>
  </div>

  <button type="submit">보내기</button>
  <p class="success-message" id="form-success"></p>
</form>
    </section>
  </main>

 <footer>
  <ul class="social-links">
    <li><a href="https://github.com/kimjexnghyexn" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    <li><a href="mailto:kimjexnghyexn@gmail.com">Email</a></li>
  </ul>
  <p>&copy; 2026 정현. All rights reserved.</p>
</footer>

  <button id="scroll-top" aria-label="맨 위로 이동">↑</button>
  
  <script src="js/main.js" defer></script>
</body>
</html>
